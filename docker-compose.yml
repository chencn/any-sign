services:
  any-sign:
    image: ghcr.io/chencn/any-sign:latest
    container_name: any-sign
    restart: unless-stopped
    ports:
      - "7860:7860"
    environment:
      - PORT=7860
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
